<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在返回 NCE StudyFree…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f1e7;
        color: #20261f;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      p { text-align: center; line-height: 1.8; }
      a { color: #14532d; font-weight: 700; }
    </style>
  </head>
  <body>
    <p>正在返回 <a id="home-link" href="/">NCE StudyFree 首页</a>…</p>
    <script>
      (function () {
        var repo = 'NCEStudyFree';
        var path = window.location.pathname;
        var base = path === '/' + repo || path.indexOf('/' + repo + '/') === 0 ? '/' + repo + '/' : '/';
        var link = document.getElementById('home-link');
        if (link) link.href = base + '#/';
        window.location.replace(base + '#/');
      })();
    </script>
  </body>
</html>
